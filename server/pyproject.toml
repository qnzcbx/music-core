[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "musicdl-core-server"
version = "0.1.0"
description = "独立音乐核心契约与本地后端"
requires-python = ">=3.10"
dependencies = ["fastapi>=0.115,<1", "pydantic>=2.10,<3", "uvicorn>=0.34,<1", "httpx==0.28.1", "anyio>=4,<5"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.28,<1"]
browser = ["playwright==1.63.0"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
"app" = ["config/*.json", "player.html", "player-controller.mjs"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
